version: "3"

vars:
  CONFIG: '{{.CONFIG | default "murklet.toml"}}'
  BASE_URL: '{{.BASE_URL | default "http://127.0.0.1:9876"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format all Rust source files
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Verify Rust formatting matches rustfmt
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run Clippy with strict workspace lints
    cmds:
      - cargo clippy --all-targets --locked -- -D warnings

  test:
    desc: Run the full Rust test suite
    cmds:
      - cargo test --locked

  stress:
    desc: Run pressure and concurrency stress tests (stampede, backpressure, purge under load)
    cmds:
      - cargo test --test pressure_stress --locked -- --nocapture

  bench:
    desc: Run reproducible Criterion benchmarks (image engine and cache eviction)
    cmds:
      - cargo bench --locked

  check:
    desc: Run the full CI quality gate (format, clippy, rustdoc, and tests)
    deps:
      - fmt:check
      - lint
      - doc
      - test

  doc:
    desc: Build API documentation and fail on broken intra-doc links
    env:
      RUSTDOCFLAGS: "-D warnings"
    cmds:
      - cargo doc --no-deps --locked

  build:
    desc: Build an optimised release binary
    cmds:
      - cargo build --release --locked

  clean:
    desc: Remove build artefacts (the local cache directory is left untouched)
    cmds:
      - cargo clean

  bench:live:
    desc: "Measure RSS, CPU, and latency of a live release build (PROFILE=standard|heavy)"
    deps:
      - build
    cmds:
      - python3 scripts/bench/live_pressure.py --profile {{.PROFILE | default "standard"}}

  config:check:
    desc: Validate a Murklet TOML configuration without starting the server
    cmds:
      - cargo run --locked -- --check {{.CONFIG}}

  dev:init:
    desc: Prepare local murklet.toml and assets directory if absent
    cmds:
      - test -f {{.CONFIG}} || cp murklet.example.toml {{.CONFIG}}
      - mkdir -p assets

  dev:
    desc: Start Murklet locally using murklet.toml (debug build)
    deps:
      - dev:init
    cmds:
      - cargo run --locked -- {{.CONFIG}}

  dev:release:
    desc: Start Murklet locally with optimised release build (recommended for AVIF)
    deps:
      - dev:init
    cmds:
      - cargo run --release --locked -- {{.CONFIG}}

  smoke:
    desc: Run an HTTP smoke test (healthz, MISS, HIT, and 304 Not Modified) against a running server
    cmds:
      - |
        set -eu
        echo "==> GET /healthz"
        curl -fsS "{{.BASE_URL}}/healthz"
        echo ""

        if [ ! -f assets/smoke.png ]; then
          echo "==> Creating 1x1 PNG fixture at assets/smoke.png"
          mkdir -p assets
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > assets/smoke.png
        fi

        echo "==> 1st GET /load (expect X-Cache: MISS)"
        headers=$(curl -fsS -D - -o /dev/null "{{.BASE_URL}}/load?url=smoke.png&w=16&f=webp")
        printf '%s\n' "$headers" | grep -iE '^(HTTP/|content-type:|etag:|cache-control:|x-cache:)'
        etag=$(printf '%s\n' "$headers" | awk 'tolower($1)=="etag:" {sub(/\r$/, "", $2); print $2}')

        echo "==> 2nd GET /load (expect X-Cache: HIT)"
        curl -fsS -D - -o /dev/null "{{.BASE_URL}}/load?url=smoke.png&w=16&f=webp" | grep -iE '^(HTTP/|content-type:|etag:|x-cache:)'

        echo "==> 3rd GET /load with If-None-Match (expect 304 Not Modified)"
        curl -sS -D - -o /dev/null -H "If-None-Match: $etag" "{{.BASE_URL}}/load?url=smoke.png&w=16&f=webp" | grep -iE '^(HTTP/|etag:|x-cache:)'

  docker:build:
    desc: Build the local Murklet container image
    cmds:
      - docker build -t murklet:local .

  docker:run:
    desc: Run the local container image on port 9876 with ./assets mounted read-only
    cmds:
      - docker run --rm -p 9876:9876 -v "$PWD/assets:/app/assets:ro" murklet:local
