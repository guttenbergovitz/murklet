# Murklet example configuration.
# Validate without starting the server: `murklet --check murklet.example.toml`

[server]
bind = "127.0.0.1:9876"
cache_control = "public, max-age=31536000, immutable"
accept_negotiation = false
metrics_enabled = true
log_format = "pretty" # "pretty" | "json"
diagnostic_headers = false
# Secret token for `POST /cache/cleanup` (sent via `X-Cache-Cleanup-Token`).
# Leave commented out to keep cache cleanup disabled (fail-closed).
# cleanup_token = "replace-with-a-strong-random-secret"
# Optional HMAC-SHA256 secret requiring a valid `sig` query parameter on `GET /load`.
# Leave commented out to accept unsigned transformation requests.
# signing_secret = "replace-with-a-strong-random-secret"

[cache]
dir = "./cache"
max_entry_bytes = 52428800 # 50 MiB
# Optional disk budget in bytes; oldest entries are evicted when exceeded.
# max_total_bytes = 1073741824 # 1 GiB
# Optional entry TTL in seconds; expired entries are evicted lazily and on sweeps.
# ttl_secs = 2592000 # 30 days
sweep_interval_secs = 300

[cache.source]
# Optional raw-source cache for remote HTTP(S) and S3 origins so multiple variants
# of the same image share a single upstream fetch.
enabled = false
dir = "./cache/sources"
# max_total_bytes = 536870912 # 512 MiB
# ttl_secs = 3600 # 1 hour

[limits]
max_input_bytes = 52428800 # 50 MiB
max_source_dimension = 16384
max_target_dimension = 8192
max_decoded_pixels = 64000000
max_concurrent_transforms = 8
# Maximum time a request waits for a transform slot before returning 503 Retry-After.
transform_queue_timeout_secs = 10
# Fallback for multi-frame GIF/WebP inputs: "first_frame" or "passthrough"
animation_policy = "first_frame"

[origins.local]
enabled = true
root = "./assets"

# Optional per-origin policy (`[origins.local.policy]`, `[origins.http.policy]`, `[origins.s3.policy]`):
# [origins.local.policy]
# presets_only = false
# allowed_presets = ["thumb"]
# allowed_formats = ["webp", "avif", "jpeg"]
# max_target_dimension = 2048
# default_watermark = "brand"
# cache_control = "public, max-age=86400"

[origins.http]
# Remote fetching is disabled by default; enabling it requires a non-empty allowlist.
enabled = false
allowed_hosts = []
timeout_secs = 15
connect_timeout_secs = 5
max_redirects = 5

[origins.s3]
# S3-compatible object storage (AWS S3, Cloudflare R2, MinIO, RustFS, etc.).
enabled = false
bucket = ""
region = "us-east-1"
# endpoint = "https://<account>.r2.cloudflarestorage.com"
# path_style = true
# prefix = "uploads/"
# Credentials default to AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY when omitted.
# access_key_id = ""
# secret_access_key = ""
timeout_secs = 15
connect_timeout_secs = 5

# Optional named transformation presets referenced via `?preset=<name>`.
# [presets.thumb]
# width = 300
# format = "webp"
# quality = 80

# Optional policy-controlled watermarks referenced via `?wm=<name>`.
# Each image is validated and decoded once at startup (zero SSRF or path traversal).
# [watermarks]
# brand = "./assets/logo.png"
